<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>4WD Car</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:sans-serif;touch-action:none;overflow:hidden}
#top{padding:12px;text-align:center;font-size:20px}
#st{font-size:14px;color:#8f8}
#pad{position:relative;width:260px;height:260px;margin:20px auto;border-radius:50%;background:#222;border:2px solid #444}
#knob{position:absolute;width:90px;height:90px;border-radius:50%;background:#4a9;left:85px;top:85px}
#warn{color:#f55;height:24px;text-align:center}
</style></head><body>
<div id="top">4WD 小车<div id="st">连接中...</div></div>
<div id="pad"><div id="knob"></div></div>
<div id="warn"></div>
<div style="text-align:center">动作: <b id="act">-</b> &nbsp; 距离: <b id="dist">-</b> cm</div>
<script>
const pad=document.getElementById('pad'),knob=document.getElementById('knob');
const st=document.getElementById('st'),act=document.getElementById('act'),
      dist=document.getElementById('dist'),warn=document.getElementById('warn');
const R=130,K=45;let ws,x=0,y=0,drag=false;
function connect(){
  ws=new WebSocket('ws://'+location.host+'/ws');
  ws.onopen=()=>{st.textContent='已连接';st.style.color='#8f8'};
  ws.onclose=()=>{st.textContent='已断开, 重连中...';st.style.color='#f55';setTimeout(connect,1000)};
  ws.onmessage=e=>{const d=JSON.parse(e.data);
    act.textContent=d.action;dist.textContent=d.dist<0?'--':d.dist;
    warn.textContent=d.blocked?'前方障碍, 已禁止前进':''};
}
function send(){if(ws&&ws.readyState==1)ws.send(JSON.stringify({x:+x.toFixed(2),y:+y.toFixed(2)}))}
function move(cx,cy){
  const r=pad.getBoundingClientRect();
  let dx=cx-(r.left+R),dy=cy-(r.top+R);
  const m=Math.hypot(dx,dy),lim=R-K;
  if(m>lim){dx*=lim/m;dy*=lim/m}
  knob.style.left=(R-K+dx)+'px';knob.style.top=(R-K+dy)+'px';
  x=dx/lim;y=-dy/lim;send();
}
function end(){drag=false;knob.style.left=(R-K)+'px';knob.style.top=(R-K)+'px';x=0;y=0;send()}
pad.addEventListener('touchstart',e=>{drag=true;move(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()},{passive:false});
pad.addEventListener('touchmove',e=>{if(drag)move(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()},{passive:false});
pad.addEventListener('touchend',end);pad.addEventListener('touchcancel',end);
pad.addEventListener('mousedown',e=>{drag=true;move(e.clientX,e.clientY)});
window.addEventListener('mousemove',e=>{if(drag)move(e.clientX,e.clientY)});
window.addEventListener('mouseup',()=>{if(drag)end()});
setInterval(()=>{if(drag)send()},100); // 心跳, 防止板端超时停车
connect();
</script></body></html>
